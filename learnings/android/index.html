<script>
/* Reset asks in place: click once to arm, click again to clear, ignore for 5s and it disarms.
   No confirm() dialog - it blocks the page, is unstyleable, and reads as a broken app on a projector. */
(function () {
  var STORE = "asw-progress-v1";
  var GAMESTORE = "asw-game-v1";   /* quiz + judgement answers live here - clear both together */
  var btn = document.getElementById("reset");
  var yes = document.getElementById("reset-yes");
  var no = document.getElementById("reset-no");
  var timer = null;

  function arm(on) {
    btn.hidden = on;
    yes.hidden = !on;
    no.hidden = !on;
    if (timer) { clearTimeout(timer); timer = null; }
    if (on) timer = setTimeout(function () { arm(false); }, 5000);
  }
  btn.addEventListener("click", function () { arm(true); });
  no.addEventListener("click", function () { arm(false); });
  yes.addEventListener("click", function () {
    try { localStorage.removeItem(STORE); } catch (e) {}
    try { localStorage.removeItem(GAMESTORE); } catch (e) {}
    location.reload();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !yes.hidden) arm(false);
  });
})();
</script>
